name: Publish a3core SUSFS build

on:
  push:
    paths:
      - 'publish-trigger/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifacts from build 45131827540
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, Node 24
        with:
          run-id: 45131827540
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          merge-multiple: false

      - name: Package flashable zip
        run: |
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/AnyKernel3*/; do
            name=$(basename "${dir%/}")
            (cd "$dir" && zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .)
          done
          for f in artifacts/*/Image*; do
            [ -f "$f" ] && cp "$f" release/
          done
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3, Node 24
        with:
          tag_name: a3core-ksu-susfs-v12-20261123
          name: a3core - KernelSU v0.9.5 - SUSFS v1.5.5 - 2026-11-23
          body: |
            SM-A032F (a3core), kernel 4.14.199, KernelSU v0.9.5, SUSFS v1.5.5 (non-GKI).

            Install the AnyKernel3 ZIP through TWRP or run:
            adb sideload <plik>.zip

            `Image` is the raw kernel for repacking a compatible `boot.img`.

            Source: https://github.com/Artemis1447/A032F-V19-EXTREME/actions/runs/45131827540
          files: release/*
