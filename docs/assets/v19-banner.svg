      .heading { font-size: 66px; font-weight: 800; letter-spacing: -2px; }
      .chip { font-size: 13px; font-weight: 700; letter-spacing: .6px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1078" height="328" rx="23" fill="url(#background)" stroke="#34586e" stroke-width="2"/>
  <g clip-path="url(#frame)" aria-hidden="true">
