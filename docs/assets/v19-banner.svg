<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">A03 Core V19 EXTREME</title>
  <desc id="banner-description">A device-tested Linux 4.14.199 kernel for the Samsung Galaxy A03 Core SM-A032F running LineageOS 21, with SukiSU-Ultra and SUSFS ABI 2.</desc>
  <defs>
